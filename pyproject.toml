[project]
name = "ocsjs-knowledge-extentions"
version = "0.2.0"
description = "OpenAI-compatible OCS(Online Course Script) AnswererWrapper service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"fastapi[standard]==0.114.2",
	"uvicorn==0.30.6",
	"pydantic==2.9.2",
	"openai==1.43.0",
	"httpx==0.27.2",
	"python-dotenv>=1.1.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv.pip]
# 可更换阿里云 https://mirrors.aliyun.com/pypi/simple
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
